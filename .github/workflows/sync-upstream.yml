name: Sync upstream

on:
  schedule:
    # 北京时间每天 02:00（UTC 18:00）合并一次上游。
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/xmanrui/dsh-im.git 2>/dev/null \
            || git remote set-url upstream https://github.com/xmanrui/dsh-im.git
          git fetch upstream main

      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo '当前 main 已包含 upstream/main，无需同步。'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: npm ci

      - name: Verify merged tree
        if: steps.merge.outputs.changed == 'true'
        run: npm run check

      - name: Push merged main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Report failure
        if: failure()
        run: |
          gh issue create \
            --title "上游同步失败 $(date -u +%F)" \
            --body "$(printf '%s\n' \
              '每日同步 upstream/main 的自动合并没有通过，main 未被修改。' \
              '' \
              "- 运行记录：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '' \
              '常见原因：合并冲突，或合入后 `npm run check` 失败。' \
              '处理方式：本地 `git fetch upstream && git merge upstream/main`，解决后跑 `npm run check` 再推送。')" \
            --label 'upstream-sync' \
            || gh issue create --title "上游同步失败 $(date -u +%F)" \
              --body "运行记录：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
