name: Sync upstream

on:
  schedule:
    # 北京时间每天 02:00（UTC 18:00）合并一次上游。
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # 设置了 UPSTREAM_SYNC_TOKEN 时用它检出，后续 git push 才能改 .github/workflows/。
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Configure upstream
        id: upstream
        run: |
          git remote add upstream https://github.com/xmanrui/dsh-im.git 2>/dev/null \
            || git remote set-url upstream https://github.com/xmanrui/dsh-im.git
          git fetch upstream main

      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo '当前 main 已包含 upstream/main，无需同步。'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # lib/ 是 npm run build 的产物、无语义，冲突时取上游版本即可，后面的
          # build 会用合并后的 src 重新生成。其余文件的冲突必须人工裁决：保留
          # 现场并失败，交给 Report failure 建 issue。
          for f in $(git diff --name-only --diff-filter=U); do
            case "$f" in
              lib/*) git checkout --theirs -- "$f" && git add "$f" ;;
              *) echo "::error::非构建产物冲突，需人工解决：$f"; exit 1 ;;
            esac
          done
          git commit --no-edit
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        id: setup_node
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        if: steps.merge.outputs.changed == 'true'
        run: npm ci

      - name: Verify merged tree
        id: check
        if: steps.merge.outputs.changed == 'true'
        run: npm run check

      # npm run check 内含 build；打包产物必须随合并一起提交，否则推送出去的
      # lib/ 仍是合并现场而不是重新生成的结果。
      - name: Commit rebuilt bundles
        id: bundles
        if: steps.merge.outputs.changed == 'true'
        run: |
          if ! git diff --quiet -- lib; then
            git add lib
            git commit --amend --no-edit
          fi

      - name: Push merged main
        id: push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # 任何失败都要留下 issue。label 不存在就先建；已有未关闭的同 label
      # issue 就评论而不是再开一张。创建和评论都失败时必须非零退出
      # （不能只打 ::error:: 然后让步骤变绿）。
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_UPSTREAM: ${{ steps.upstream.outcome }}
          STEP_MERGE: ${{ steps.merge.outcome }}
          STEP_SETUP_NODE: ${{ steps.setup_node.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_CHECK: ${{ steps.check.outcome }}
          STEP_BUNDLES: ${{ steps.bundles.outcome }}
          STEP_PUSH: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail

          gh label create upstream-sync \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description '上游同步（upstream/main）自动合并失败' \
            --force || true

          conflicts=""
          upstream_sha="unknown"
          workflow_diff=""
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            conflicts="$(git diff --name-only --diff-filter=U 2>/dev/null || true)"
            upstream_sha="$(git rev-parse --short upstream/main 2>/dev/null || echo unknown)"
            if git rev-parse --verify origin/main >/dev/null 2>&1 && git rev-parse --verify HEAD >/dev/null 2>&1; then
              workflow_diff="$(git diff --name-only origin/main...HEAD -- .github/workflows 2>/dev/null || true)"
            fi
          fi

          unmerged_workflows=""
          if [ -n "$conflicts" ]; then
            unmerged_workflows="$(printf '%s\n' "$conflicts" | grep '^\.github/workflows/' || true)"
          fi

          reason="同步任务失败"
          if [ "${STEP_CHECKOUT:-}" = failure ]; then
            reason="检出仓库失败"
          elif [ "${STEP_UPSTREAM:-}" = failure ]; then
            reason="拉取上游 xmanrui/dsh-im main 失败"
          elif [ -n "$conflicts" ]; then
            reason="合并冲突：非 lib/ 文件需要人工解决（lib/ 构建产物按上游版本自动处理）"
          elif [ "${STEP_MERGE:-}" = failure ]; then
            reason="合并 upstream/main 失败"
          elif [ "${STEP_SETUP_NODE:-}" = failure ]; then
            reason="安装 Node.js 失败"
          elif [ "${STEP_INSTALL:-}" = failure ]; then
            reason="npm ci 失败"
          elif [ "${STEP_CHECK:-}" = failure ]; then
            reason="npm run check 失败"
          elif [ "${STEP_BUNDLES:-}" = failure ]; then
            reason="提交重新构建的 lib/ 失败"
          elif [ "${STEP_PUSH:-}" = failure ]; then
            reason="推送到 origin/main 失败"
          fi

          if [ -n "$conflicts" ]; then
            conflict_block="$(printf '%s\n' "$conflicts" | sed 's/^/- /')"
          else
            conflict_block="- （没有未合并文件，请看运行日志里失败的步骤）"
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          pat_hint="$(printf '%s\n' \
            '若推送被拒绝，且变更包含 `.github/workflows/`：默认的 `GITHUB_TOKEN` 没有 `workflows` 权限，GitHub 会拒绝修改 workflow 文件。请在仓库 Settings → Secrets and variables → Actions 添加 secret `UPSTREAM_SYNC_TOKEN`（PAT，需要 `repo` 与 `workflow` 权限）。配置后，本工作流会优先用它检出、推送，并用它创建或评论 issue。')"
          if [ -n "$unmerged_workflows" ] || [ -n "$workflow_diff" ] || [ "${STEP_PUSH:-}" = failure ]; then
            pat_hint="$(printf '%s\n\n%s\n' '这次失败可能就是 workflow 文件推送权限不足。' "$pat_hint")"
          fi

          title="上游同步失败 $(date -u +%F)"
          body="$(printf '%s\n' \
            '每日同步上游没有完成，fork 的 `main` 没有被这次运行更新。' \
            '' \
            "- 失败原因：${reason}" \
            "- 运行记录：${run_url}" \
            '- 上游仓库：https://github.com/xmanrui/dsh-im' \
            "- 上游分支：\`main\`（${upstream_sha}）" \
            '' \
            '冲突文件：' \
            '' \
            "${conflict_block}" \
            '' \
            '本地修复：' \
            '' \
            '```sh' \
            'git remote add upstream https://github.com/xmanrui/dsh-im.git 2>/dev/null || git remote set-url upstream https://github.com/xmanrui/dsh-im.git' \
            'git fetch upstream main' \
            'git merge upstream/main' \
            '# 非 lib/ 冲突需要人工解决。lib/ 是构建产物，冲突可执行 git checkout --theirs -- lib 后重新构建。' \
            'npm ci' \
            'npm run check' \
            'git push origin main' \
            '```' \
            '' \
            "${pat_hint}")"
          comment="$(printf '%s\n' \
            '又一次同步失败，沿用这张未关闭的 issue，不重复开新的。' \
            '' \
            "- 失败原因：${reason}" \
            "- 运行记录：${run_url}" \
            '- 上游：https://github.com/xmanrui/dsh-im 分支 `main`（'"${upstream_sha}"'）' \
            '' \
            '冲突文件：' \
            '' \
            "${conflict_block}" \
            '' \
            "${pat_hint}")"

          existing=""
          list_err="${RUNNER_TEMP:-/tmp}/upstream-sync-issue-list.err"
          if ! existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-sync --state open --limit 20 --json number --jq '.[-1].number' 2>"$list_err")"; then
            echo '::warning::按 upstream-sync 查询已有 issue 失败，改为尝试新建'
            cat "$list_err" || true
            existing=""
          fi

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "已有未关闭的 upstream-sync issue #${existing}，改为评论。"
            if gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$comment"; then
              exit 0
            fi
            echo "::error::评论 issue #${existing} 失败"
            exit 1
          fi

          if gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label upstream-sync; then
            exit 0
          fi

          echo '::warning::带 label 的 issue 创建失败，退回无 label 重试'
          if gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; then
            exit 0
          fi

          echo '::error::无法创建或评论 issue。若日志是 Resource not accessible by integration (createIssue)，多半是仓库没开 Issues（fork 默认关闭）；请在 Settings → General → Features 打开 Issues。也可配置 secret UPSTREAM_SYNC_TOKEN。'
          exit 1
